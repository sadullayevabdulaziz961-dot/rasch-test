<script>

        question:

        answer: "46"
    }

];


let currentQuestion = 0;
let answers = [];
let testCode = "";


/* TESTNI BOSHLASH */

document
.getElementById("startButton")
.addEventListener("click", function() {

    testCode =
        document
        .getElementById("testCode")
        .value

    if (testCode === "") {

        alert("Test kodini kiriting!");

        return;

/* SAVOLNI KO‘RSATISH */

function showQuestion() {

    const q =
        questions[currentQuestion];


    document
    .getElementById("questionNumber")
    .innerText =
        "Savol " +
        (currentQuestion + 1) +
        " / " +
        questions.length;


    document
    .getElementById("questionText")
    .innerText =
        q.question;


    const area =
        document
        .getElementById("answerArea");


    area.innerHTML = "";


    /* TEST */

    if (q.type === "single") {

        q.options.forEach(function(option, index) {

            const button =
                document.createElement("button");


            button.className = "option";


            button.innerText =
                String.fromCharCode(65 + index)
                + ") "
                + option;


            button.addEventListener(
                "click",
                function() {

                    answers[currentQuestion] =
                        index;


                    const buttons =
                        area.querySelectorAll(
                            ".option"
                        );


                    buttons.forEach(
                        function(btn) {

                            btn.classList.remove(
                                "selected"
                            );

                        }
                    );


                    button.classList.add(
                        "selected"
                    );

                }
            );


            area.appendChild(button);

        });


        if (
            answers[currentQuestion]
            !== undefined
        ) {

            const buttons =
                area.querySelectorAll(
                    ".option"
                );

            buttons[
                answers[currentQuestion]
            ].classList.add("selected");

        }

    }


    /* OCHIQ SAVOL */

    if (q.type === "open") {

        const input =
            document.createElement("input");


        input.type = "text";

        input.placeholder =
            "Javobingizni yozing";


        input.value =
            answers[currentQuestion] || "";


        input.addEventListener(
            "input",
            function() {

                answers[currentQuestion] =
                    input.value;

            }
        );


        area.appendChild(input);

    }

}


/* OLDINGI */

document
.getElementById("previousButton")
.addEventListener("click", function() {

    if (currentQuestion > 0) {

        currentQuestion--;

        showQuestion();

    }

});


/* KEYINGI */

document
.getElementById("nextButton")
.addEventListener("click", function() {

    if (
        currentQuestion <
        questions.length - 1
    ) {

        currentQuestion++;

        showQuestion();

    } else {

        finishTest();

    }

});


/* TESTNI YAKUNLASH */

function finishTest() {

    let correct = 0;


    questions.forEach(function(q, index) {

        if (q.type === "single") {

            if (
                answers[index] === q.answer
            ) {

                correct++;

            }

        }


        if (q.type === "open") {

            if (
                answers[index] &&
                answers[index]
                .trim()
                .toLowerCase()
                ===
                q.answer
                .toLowerCase()
            ) {

                correct++;

            }

        }

    });


    /* TELEGRAMGA YUBORISH */

    if (
        window.Telegram &&
        Telegram.WebApp &&
        Telegram.WebApp.sendData
    ) {

        Telegram.WebApp.sendData(
            JSON.stringify({

                testCode: testCode,

                answers: answers

            })
        );

    }


    document
    .getElementById("testPage")
    .style
    .display = "none";


    document
    .getElementById("resultPage")
    .style
    .display = "block";
