<body>

<div class="container">

    <!-- KOD KIRITISH -->
    <div id="codePage">

        <h1>🧬 Biologiya testi</h1>

        <input
            id="testCode"
            type="text"
            placeholder="Test kodini kiriting"
        >

        <button

            TESTNI BOSHLASH

                ← Oldingi

        </div>

    </div>

    <div id="resultPage">

        ></p>

<script>

"use strict";


/* TELEGRAM */

let telegram = null;

if (
    window.Telegram &&
    window.Telegram.WebApp
) {

    telegram = window.Telegram.WebApp;

    telegram.ready();

    telegram.expand();

}


/* SAVOLLAR */

const questions = [

    {
        type: "single",

        answer: 1
    },

    {

        question:
        "Odam somatik hujayrasida nechta xromosoma mavjud?",

        options: [
            "23",
            "44",
            "46",
            "48"
        ],

        answer: 2
    },

    {
        type: "single",

        question:
        "DNK tarkibidagi azotli asoslardan qaysi biri pirimidin hisoblanadi?",

        options: [
            "Adenin",
            "Guanin",
            "Sitozin",
            "Adenin va guanin"
        ],

        answer: 2
    },

    {

        question:
        "Odamning normal somatik hujayrasida nechta xromosoma bor?",

        answer: "46"
    },

    {
        type: "open",

        question:
        "Fotosintezda atmosferaga ajralib chiqadigan gazni yozing.",

        answer: "kislorod"
    }

];


/* O'ZGARUVCHILAR */

let currentQuestion = 0;

let answers = [];

let testCode = "";

let timeLeft = 60 * 60;

let timerInterval = null;


/* TESTNI BOSHLASH */

document
.getElementById("startButton")
.addEventListener(
    "click",
    startTest
);


function startTest() {

    const input =
        document.getElementById("testCode");

    testCode =
        input.value.trim();


    if (testCode === "") {

        alert(
            "Avval test kodini kiriting!"
        );

        input.focus();

        return;
    }


    /* KOD OYNASINI YOPISH */

    document
    .getElementById("codePage")
    .style
    .display = "none";


    /* TEST OYNASINI OCHISH */

    document
    .getElementById("testPage")
    .style
    .display = "block";


    /* BOSHLANG'ICH HOLAT */

    currentQuestion = 0;

    answers = [];

    timeLeft = 60 * 60;


    showQuestion();

    startTimer();

}


/* SAVOLNI KO'RSATISH */

function showQuestion() {

    const question =
        questions[currentQuestion];


    document
    .getElementById("questionNumber")
    .textContent =
        "Savol " +
        (currentQuestion + 1) +
        " / " +
        questions.length;


    document
    .getElementById("questionText")
    .textContent =
        question.question;


    const answerArea =
        document
        .getElementById("answerArea");


    answerArea.innerHTML = "";


    /* VARIANTLI SAVOL */

    if (
        question.type === "single"
    ) {

        question.options.forEach(
            function(option, index) {

                const button =
                    document
                    .createElement("button");


                button.type = "button";

                button.className =
                    "option";


                button.textContent =
                    String.fromCharCode(
                        65 + index
                    )
                    + ") "
                    + option;


                button.addEventListener(
                    "click",
                    function() {

                        answers[
                            currentQuestion
                        ] = index;


                        const allButtons =
                            answerArea
                            .querySelectorAll(
                                ".option"
                            );


                        allButtons.forEach(
                            function(btn) {

                                btn.classList.remove(
                                    "selected"
                                );

                            }
                        );


                        button.classList.add(
                            "selected"
                        );

                    }
                );


                answerArea.appendChild(
                    button
                );

            }
        );


        /* OLDIN TANLANGAN JAVOB */
[16.09.2026 2:32] Abdulaziz: if (
            answers[currentQuestion]
            !== undefined
        ) {

            const buttons =
                answerArea
                .querySelectorAll(
                    ".option"
                );


            buttons[
                answers[currentQuestion]
            ].classList.add(
                "selected"
            );

        }

    }


    /* OCHIQ SAVOL */

    if (
        question.type === "open"
    ) {

        const input =
            document
            .createElement("input");


        input.type = "text";

        input.className =
            "answer-input";

        input.placeholder =
            "Javobingizni yozing";


        input.value =
            answers[currentQuestion]
            || "";


        input.addEventListener(
            "input",
            function() {

                answers[
                    currentQuestion
                ] =
                    input.value;

            }
        );


        answerArea.appendChild(
            input
        );

    }

}


/* KEYINGI */

document
.getElementById("nextButton")
.addEventListener(
    "click",
    nextQuestion
);


function nextQuestion() {

    if (
        currentQuestion <
        questions.length - 1
    ) {

        currentQuestion++;

        showQuestion();

        return;
    }


    finishTest();

}


/* OLDINGI */

document
.getElementById("previousButton")
.addEventListener(
    "click",
    previousQuestion
);


function previousQuestion() {

    if (
        currentQuestion > 0
    ) {

        currentQuestion--;

        showQuestion();

    }

}


/* TIMER */

function startTimer() {

    clearInterval(
        timerInterval
    );


    updateTimer();


    timerInterval =
        setInterval(
            function() {

                timeLeft--;

                updateTimer();


                if (
                    timeLeft <= 0
                ) {

                    clearInterval(
                        timerInterval
                    );

                    finishTest();

                }

            },
            1000
        );

}


function updateTimer() {

    const minutes =
        Math.floor(
            timeLeft / 60
        );


    const seconds =
        timeLeft % 60;


    document
    .getElementById("timer")
    .textContent =
        "Vaqt: "
        +
        String(minutes)
        .padStart(2, "0")
        +
        ":"
        +
        String(seconds)
        .padStart(2, "0");

}


/* TESTNI YAKUNLASH */

function finishTest() {

    clearInterval(
        timerInterval
    );


    let correct = 0;


    questions.forEach(
        function(question, index) {

            if (
                question.type === "single"
            ) {

                if (
                    answers[index] ===
                    question.answer
                ) {

                    correct++;

                }

            }


            if (
                question.type === "open"
            ) {

                const userAnswer =
                    String(
                        answers[index]
                        || ""
                    )
                    .trim()
                    .toLowerCase();


                const correctAnswer =
                    String(
                        question.answer
                    )
                    .trim()
                    .toLowerCase();


                if (
                    userAnswer ===
                    correctAnswer
                ) {

                    correct++;

                }

            }

        }
    );


    /* TELEGRAMGA YUBORISH */

    const result = {

        testCode: testCode,

        answers: answers,

        correct: correct,

        total: questions.length

    };


    if (
        telegram &&
        typeof telegram.sendData ===
        "function"
    ) {

        telegram.sendData(
            JSON.stringify(result)
        );

    }


    /* NATIJA OYNASI */

    .textContent =
        "To‘g‘ri javoblar: "
        +
        correct
        +
        " / "
        +
        questions.length;

}

</script>
