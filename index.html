<script>


/* TELEGRAM */

/* TEST SAVOLLARI */

const questions = [

    {
        type: "single",

        question:
            "Fotosintez jarayonining yorug‘lik bosqichi qayerda kechadi?",

        options: [
            "Mitoxondriyada",
            "Tilakoid membranasida",
            "Sitoplazmada",
            "Yadroda"
        ],

        answer: 1
    },


    {
        type: "single",

        question:
            "Odam somatik hujayrasida nechta xromosoma mavjud?",

        options: [
            "23",
            "44",
            "46",
            "48"
        ],

        answer: 2
    },


    {
        type: "open",

        question:
            "Odamning normal somatik hujayrasidagi xromosomalar sonini kiriting.",

        answer: "46"
    }

];


/* O'ZGARUVCHILAR */

let currentQuestion = 0;

let userAnswers = [];

let testCode = "";


/* TESTNI BOSHLASH */

function startTest() {

    testCode =
        document
            .getElementById("testCode")
            .value
            .trim();


    if (testCode === "") {

        alert(
            "Test kodini kiriting!"
        );

        return;
    }


    document
        .getElementById("codePage")
        .style
        .display = "none";


    document
        .getElementById("testPage")
        .style
        .display = "block";


    currentQuestion = 0;

    userAnswers = [];


    showQuestion();

}


/* SAVOLNI KO'RSATISH */

function showQuestion() {

    const q =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .innerText =
            "Savol " +
            (currentQuestion + 1) +
            " / " +
            questions.length;


    document
        .getElementById("questionText")
        .innerText =
            q.question;


    const area =
        document.getElementById(
            "answerArea"
        );


    area.innerHTML = "";


    /* SINGLE CHOICE */

    if (q.type === "single") {

        q.options.forEach(
            function(option, index) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.type = "button";

                button.className =
                    "option";


                button.innerText =
                    String.fromCharCode(
                        65 + index
                    ) +
                    ") " +
                    option;


                button.onclick =
                    function() {

                        selectAnswer(
                            index,
                            button
                        );

                    };


                area.appendChild(
                    button
                );


            }
        );


        if (
            userAnswers[currentQuestion]
            !== undefined
        ) {

            const buttons =
                area.querySelectorAll(
                    ".option"
                );


            buttons[
                userAnswers[currentQuestion]
            ].classList.add(
                "selected"
            );

        }

    }


    /* OCHIQ JAVOB */

    if (q.type === "open") {

        const input =
            document.createElement(
                "input"
            );


        input.type = "text";

        input.className =
            "answer-input";


        input.placeholder =
            "Javobingizni kiriting";


        input.value =
            userAnswers[currentQuestion]
            || "";


        input.oninput =
            function() {

                userAnswers[
                    currentQuestion
                ] =
                    input.value;

            };


        area.appendChild(
            input
        );

    }

}


/* JAVOB TANLASH */

function selectAnswer(
    index,
    button
) {

    userAnswers[
        currentQuestion
    ] = index;


    const buttons =
        document.querySelectorAll(
            ".option"
        );

        function(btn) {

            btn.classList.remove(
                "selected"
            );

        }
    );


    button.classList.add(
        "selected"
    );

}


/* KEYINGI SAVOL */

function nextQuestion() {

    if (
        currentQuestion <
        questions.length - 1
    ) {

        currentQuestion++;

        showQuestion();

    }

    else {

        finishTest();

    }

}


/* OLDINGI SAVOL */

function previousQuestion() {

    if (
        currentQuestion > 0
    ) {

        currentQuestion--;

        showQuestion();

    }

}


/* TESTNI YAKUNLASH */

function finishTest() {


    const resultData =
        JSON.stringify({

            testCode:
                testCode,

            answers:
                userAnswers

        });


    /* TELEGRAM WEB APP */

    if (
        window.Telegram &&
        Telegram.WebApp &&
        typeof Telegram.WebApp.sendData ===
        "function"
    ) {

        Telegram.WebApp.sendData(
            resultData
        );

        return;

    }


    /* TELEGRAMDAN TASHQARIDA */

    let correct = 0;


    questions.forEach(
        function(q, index) {


            if (
                q.type === "single"
            ) {

                if (
                    userAnswers[index] ===
                    q.answer
                ) {

                    correct++;

                }

            }


            if (
                q.type === "open"
            ) {

                if (
                    userAnswers[index] &&
                    userAnswers[index]
                        .trim()
                        .toLowerCase()
                    ===
                    q.answer
                        .toLowerCase()
                ) {

                    correct++;

                }

            }

        }
    );


    document
        .getElementById("testPage")
        .style
        .display = "none";


    document
        .getElementById("resultPage")
        .style
        .display = "block";


    document
        .getElementById("resultText")
        .innerText =
            "To‘g‘ri javoblar: " +
            correct +
            " / " +
            questions.length;

}


</script>
