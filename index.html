 <!DOCTYPE html>
<html lang="uz">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Biologiya testi</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            background: white;
            font-family: Arial, sans-serif;
        }


        .container {
            width: 92%;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 10px;
        }


        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 30px;
        }


        input {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            border: 1px solid #ccc;
            border-radius: 10px;
            margin-bottom: 15px;
            outline: none;
        }


        input:focus {
            border-color: #2481cc;
        }


        button {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            border: none;
            border-radius: 10px;
            background: #2481cc;
            color: white;
            cursor: pointer;
        }


        button:active {
            opacity: 0.8;
        }


        .hidden {
            display: none;
        }


        .question-number {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 15px;
        }


        .question {
            font-size: 19px;
            line-height: 1.5;
            margin-bottom: 25px;
        }


        .option {
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: white;
            color: black;
            text-align: left;
        }


        .option.selected {
            background: #2481cc;
            color: white;
            border-color: #2481cc;
        }


        .navigation {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }


        .navigation button {
            flex: 1;
        }


        .timer {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }


        .answer-input {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- TEST KODI -->

    <div id="codePage">

        <h1>
            Biologiya testi
        </h1>


        <input
            type="text"
            id="testCode"
            placeholder="Test kodini kiriting"
        >


        <button
            type="button"
            onclick="startTest()"
        >
            TESTNI BOSHLASH
        </button>

    </div>



    <!-- TEST SAHIFASI -->

    <div
        id="testPage"
        class="hidden"
    >


        <div
            class="timer"
            id="timer"
        >
            Vaqt: 60:00
        </div>


        <div
            class="question-number"
            id="questionNumber"
        >
        </div>


        <div
            class="question"
            id="questionText"
        >
        </div>


        <div id="answerArea">
        </div>


        <div class="navigation">

            <button
                type="button"
                onclick="previousQuestion()"
            >
                ← Oldingi
            </button>


            <button
                type="button"
                onclick="nextQuestion()"
            >
                Keyingi →
            </button>

        </div>

    </div>



    <!-- NATIJA -->

    <div
        id="resultPage"
        class="hidden"
    >

        <h1>
            Test yakunlandi
        </h1>


        <p id="resultText">
        </p>

            type="button"
            onclick="location.reload()"
        >
            QAYTA BOSHLASH
        </button>

    </div>


</div>



<script>


/* =====================================
   TELEGRAM WEB APP
===================================== */


if (
    window.Telegram &&
    Telegram.WebApp
) {

    Telegram.WebApp.ready();

}



/* =====================================
   TEST SAVOLLARI
===================================== */


const questions = [

    {

        type: "single",

        question:
            "Fotosintez jarayonining yorug‘lik bosqichi qayerda kechadi?",

        options: [

            "Mitoxondriyada",

            "Tilakoid membranasida",

            "Sitoplazmada",

            "Yadroda"

        ],

        answer: 1

    },


    {

        type: "single",

        question:
            "Odam somatik hujayrasida nechta xromosoma mavjud?",

        options: [

            "23",

            "44",

            "46",

            "48"

        ],

        answer: 2

    },


    {

        type: "open",

        question:
            "Odamning normal somatik hujayrasidagi xromosomalar sonini kiriting.",

        answer: "46"

    }

];



/* =====================================
   O'ZGARUVCHILAR
===================================== */


let currentQuestion = 0;

let userAnswers = [];



/* =====================================
   TESTNI BOSHLASH
===================================== */


function startTest() {


    const code = document
        .getElementById("testCode")
        .value
        .trim();


    if (code === "") {

        alert("Test kodini kiriting!"
        );

        return;

    }


    document
        .getElementById("codePage")
        .classList
        .add("hidden");


    document
        .getElementById("testPage")
        .classList
        .remove("hidden");


    showQuestion();

}



/* =====================================
   SAVOLNI KO'RSATISH
===================================== */


function showQuestion() {


    const q =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .innerText =
            "Savol " +
            (currentQuestion + 1) +
            " / " +
            questions.length;


    document
        .getElementById("questionText")
        .innerText =
            q.question;


    const area =
        document.getElementById(
            "answerArea"
        );


    area.innerHTML = "";



    /* A/B/C/D SAVOL */

    if (q.type === "single") {


        q.options.forEach(
            function(option, index) {


                const button =
                    document.createElement(
                        "button"
                    );


                button.type = "button";


                button.className =
                    "option";


                button.innerText =
                    String.fromCharCode(
                        65 + index
                    ) +
                    ") " +
                    option;


                button.onclick =
                    function() {

                        selectAnswer(
                            index,
                            button
                        );

                    };


                area.appendChild(
                    button
                );


            }
        );


        /* Oldingi tanlangan javobni ko'rsatish */

        if (
            userAnswers[currentQuestion] !==
            undefined
        ) {


            const buttons =
                area.querySelectorAll(
                    ".option"
                );


            buttons[
                userAnswers[currentQuestion]
            ].classList.add(
                "selected"
            );

        }

    }



    /* OCHIQ JAVOB */

    if (q.type === "open") {


        const input =
            document.createElement(
                "input"
            );


        input.type = "text";


        input.className =
            "answer-input";
[16.09.2026 1:18] Abdulaziz: input.placeholder =
            "Javobingizni kiriting";


        input.value =
            userAnswers[currentQuestion]
            || "";


        input.oninput =
            function() {

                userAnswers[
                    currentQuestion
                ] = input.value;

            };


        area.appendChild(
            input
        );

    }

}



/* =====================================
   VARIANT TANLASH
===================================== */


function selectAnswer(
    index,
    button
) {


    userAnswers[
        currentQuestion
    ] = index;


    const buttons =
        document.querySelectorAll(
            ".option"
        );


    buttons.forEach(
        function(btn) {

            btn.classList.remove(
                "selected"
            );

        }
    );


    button.classList.add(
        "selected"
    );

}



/* =====================================
   KEYINGI SAVOL
===================================== */


function nextQuestion() {


    if (
        currentQuestion <
        questions.length - 1
    ) {


        currentQuestion++;


        showQuestion();


    } else {


        finishTest();

    }

}



/* =====================================
   OLDINGI SAVOL
===================================== */


function previousQuestion() {


    if (
        currentQuestion > 0
    ) {


        currentQuestion--;


        showQuestion();

    }

}



/* =====================================
   TESTNI YAKUNLASH
===================================== */


function finishTest() {


    const resultData =
        JSON.stringify({

            answers:
                userAnswers

        });



    /* TELEGRAM ICHIDA OCHILGAN BO'LSA */

    if (
        window.Telegram &&
        Telegram.WebApp &&
        typeof Telegram.WebApp.sendData ===
        "function"
    ) {


        Telegram.WebApp.sendData(
            resultData
        );


        return;

    }



    /* TELEGRAMDAN TASHQARIDA
       OCHILGAN BO'LSA
    */


    let correct = 0;


    questions.forEach(
        function(q, index) {


            if (
                q.type === "single"
            ) {


                if (
                    userAnswers[index] ===
                    q.answer
                ) {

                    correct++;

                }

            }


            if (
                q.type === "open"
            ) {


                if (

                    userAnswers[index] &&

                    userAnswers[index]
                        .trim()
                        .toLowerCase()
                    ===
                    q.answer
                        .toLowerCase()

                ) {

                    correct++;

                }

            }

        }
    );



    document
        .getElementById("testPage")
        .classList
        .add("hidden");


    document
        .getElementById("resultPage")
        .classList
        .remove("hidden");


    document
        .getElementById("resultText")
        .innerText =

            "To‘g‘ri javoblar: " +

            correct +

            " / " +

            questions.length;

}


</script>


</body>

</html>
