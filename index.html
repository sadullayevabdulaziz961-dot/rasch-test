<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biologiya testi</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: white;
        }

        .box {
            max-width: 500px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: #2481cc;
            color: white;
        }

        #testPage {
            display: none;
        }

        .question {
            font-size: 20px;
            margin: 25px 0;
        }

        .option {
            background: white;
            color: black;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            text-align: left;
        }
    </style>
</head>

<body>

<div class="box">

    <div id="codePage">

        <h1>🧬 Biologiya testi</h1>

        <input
            id="code"
            type="text"
            placeholder="Test kodini kiriting"
        >

        <button
            type="button"
            onclick="startTest()"
        >
            TESTNI BOSHLASH
        </button>

    </div>


    <div id="testPage">

        <h2 id="number"></h2>

        <div
            id="question"
            class="question"
        ></div>

        <div id="answers"></div>

        <br>

        <button
            type="button"
            onclick="nextQuestion()"
        >
            KEYINGI →
        </button>

    </div>

</div>


<script>

let current = 0;

const questions = [

    {
        question:
        "Fotosintezning yorug‘lik bosqichi qayerda kechadi?",

        options: [
            "Mitoxondriyada",
            "Tilakoid membranasida",
            "Sitoplazmada",
            "Yadroda"
        ]
    },

    {
        question:
        "Odam somatik hujayrasida nechta xromosoma mavjud?",

        options: [
            "23",
            "44",
            "46",
            "48"
        ]
    },

    {
        question:
        "DNK tarkibidagi pirimidin asos qaysi?",

        options: [
            "Adenin",
            "Guanin",
            "Sitozin",
            "Adenin va guanin"
        ]
    }

];


function startTest() {

    const code =
        document
        .getElementById("code")
        .value
        .trim();


    if (code === "") {

        alert("Test kodini kiriting!");

        return;

    }


    document
    .getElementById("codePage")
    .style
    .display = "none";


    document
    .getElementById("testPage")
    .style
    .display = "block";


    showQuestion();

}


function showQuestion() {

    const q =
        questions[current];


    document
    .getElementById("number")
    .innerText =
        "Savol " +
        (current + 1) +
        " / " +
        questions.length;


    document
    .getElementById("question")
    .innerText =
        q.question;


    const area =
        document
        .getElementById("answers");


    area.innerHTML = "";


    q.options.forEach(
        function(option, index) {

            const button =
                document.createElement(
                    "button"
                );


            button.type = "button";

            button.className = "option";


            button.innerText =
                String.fromCharCode(
                    65 + index
                )
                + ") "
                + option;


            button.onclick =
                function() {
[16.09.2026 2:37] Abdulaziz: alert(
                        "Siz " +
                        String.fromCharCode(
                            65 + index
                        ) +
                        " variantni tanladingiz."
                    );

                };


            area.appendChild(button);

        }
    );

}


function nextQuestion() {

    if (
        current <
        questions.length - 1
    ) {

        current++;

        showQuestion();

    } else {

        alert("Test tugadi!");

    }

}

</script>

</body>
</html>
